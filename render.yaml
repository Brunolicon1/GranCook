services:
  # Servidor Backend Django
  - type: web
    name: grancook-backend
    env: python
    region: ohio
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grancook-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      # Usando banco de dados para evitar erro do Redis gratuito indisponível
      - key: REDIS_URL
        value: "dummy"

  # Frontend Next.js
  - type: web
    name: grancook-frontend
    env: node
    region: ohio
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://grancook-backend.onrender.com/api"

databases:
  - name: grancook-db
    databaseName: grancook_db
    user: grancook_user
    plan: free
    region: ohio
