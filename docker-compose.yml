version: '3.8'

services:
  # Nosso banco de dados relacional
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=grancook_db
      - POSTGRES_USER=grancook_user
      - POSTGRES_PASSWORD=grancook_password
    ports:
      - "5433:5432"

  # Nosso cache em memória
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Nossa aplicação Django
  web:
    build: ./backend
    command: ./entrypoint.sh
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=grancook_db
      - DB_USER=grancook_user
      - DB_PASS=grancook_password
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  # Nosso trabalhador de segundo plano (Motor de Retenção)
  celery-worker:
    build: ./backend
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=grancook_db
      - DB_USER=grancook_user
      - DB_PASS=grancook_password
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  # O Rosto do Sistema: Front-end em Next.js
  web-frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
